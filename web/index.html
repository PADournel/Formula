<!doctype html>
<html lang="en" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<title>FORMULA</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; script-src 'self'">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="bg">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div id="bg-art"></div>
  <div id="bg-fade"></div>
</div>

<aside id="rail">
  <div class="logo">
    <svg viewBox="0 0 40 40" class="mark" aria-hidden="true">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b6cff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs>
      <path d="M8 6h26l-4 7H16l-1.6 4H28l-4 7H11.6L8 34H1z" fill="url(#lg)"/>
    </svg>
    <span>FORMULA</span>
  </div>
  <nav id="nav"></nav>
  <div class="rail-bottom">
    <button class="nav-item small" data-action="rescan"><i>⟳</i><span data-i18n="refresh"></span></button>
    <button class="nav-item small" data-action="settings"><i>⚙</i><span data-i18n="settings"></span></button>
    <button class="nav-item small" data-action="quit"><i>⏻</i><span data-i18n="quit"></span></button>
    <div id="version"></div>
  </div>
</aside>

<main id="main">
  <header id="top">
    <div class="search"><i>⌕</i><input id="search" data-i18n-ph="search" autocomplete="off" spellcheck="false"></div>
    <button id="sort" class="chip"></button>
    <div class="spacer"></div>
    <div id="status" class="chip ghost hidden"></div>
    <div id="sync" class="chip ghost hidden"></div>
    <div id="clock"></div>
  </header>

  <section id="hero">
    <div id="hero-cover"></div>
    <div id="hero-info">
      <div id="hero-tags"></div>
      <h1 id="hero-title"></h1>
      <div id="hero-meta"></div>
      <div id="hero-actions">
        <button id="play" class="btn primary"><span class="tri"></span><span data-i18n="play"></span></button>
        <button id="fav" class="btn ghost"></button>
      </div>
    </div>
  </section>

  <div id="section-head"><h2 id="section-title"></h2><span id="count"></span></div>
  <section id="grid" tabindex="-1"></section>
  <div id="empty" class="hidden">
    <div class="empty-icon">◇</div>
    <p data-i18n="empty"></p>
    <small data-i18n-html="emptyHint"></small>
  </div>
</main>

<footer id="hints">
  <div class="hint-list">
    <span><b class="pad a">A</b><span data-i18n="play"></span></span>
    <span><b class="pad y">Y</b><span data-i18n="favorite"></span></span>
    <span><b class="pad x">X</b><span data-i18n="searchShort"></span></span>
    <span><b class="pad sh">LB</b><b class="pad sh">RB</b><span data-i18n="console"></span></span>
    <span><b class="pad sh">☰</b><span data-i18n="sort"></span></span>
    <span><b class="pad sh">⧉</b><span data-i18n="settings"></span></span>
    <span><b class="pad b">B</b><span data-i18n="back"></span></span>
  </div>
  <div id="zoom" data-i18n-title="coverSize">
    <b class="pad sh">LT</b>
    <button id="zoom-out" class="zoom-btn" tabindex="-1">−</button>
    <input id="zoom-range" type="range" min="50" max="200" step="10" value="100" tabindex="-1">
    <button id="zoom-in" class="zoom-btn" tabindex="-1">+</button>
    <b class="pad sh">RT</b>
    <span id="zoom-val">100 %</span>
  </div>
</footer>

<div id="running" class="hidden">
  <div class="run-card">
    <div id="run-cover"></div>
    <div>
      <div class="run-label" data-i18n="running"></div>
      <div id="run-title"></div>
      <div class="run-sub" data-i18n="runningHint"></div>
    </div>
  </div>
</div>

<div id="osk" class="hidden">
  <div class="osk-panel">
    <div class="osk-field"><i>⌕</i><span id="osk-text"></span><span class="caret"></span></div>
    <div id="osk-keys"></div>
    <div class="osk-hints">
      <span><b class="pad a">A</b><span data-i18n="oskType"></span></span><span><b class="pad b">B</b><span data-i18n="oskErase"></span></span>
      <span><b class="pad y">Y</b><span data-i18n="oskSpace"></span></span><span><b class="pad sh">☰</b><span data-i18n="oskDone"></span></span>
      <span><b class="pad x">X</b><span data-i18n="close"></span></span>
    </div>
  </div>
</div>

<div id="settings" class="hidden">
  <div class="set-panel">
    <div class="set-head">
      <h2 data-i18n="settings"></h2>
      <div id="storage">
        <div class="st-line"><span data-i18n="storage"></span><b id="st-free"></b></div>
        <div class="st-bar"><i class="st-formula"></i><i class="st-other"></i></div>
        <div class="st-legend">
          <span><em class="dot formula"></em>FORMULA <b id="st-formula"></b></span>
          <span><em class="dot other"></em><span data-i18n="other"></span> <b id="st-other"></b></span>
          <span><em class="dot free"></em><span data-i18n="free"></span></span>
        </div>
      </div>
      <button class="set-close" data-i18n-title="close">✕</button>
    </div>
    <div class="set-body">
      <section class="set-section">
        <h3 data-i18n="language"></h3>
        <p data-i18n="languageHint"></p>
        <div class="set-options" id="set-lang">
          <button class="set-opt" data-lang="en"><span class="flag">EN</span>English</button>
          <button class="set-opt" data-lang="fr"><span class="flag">FR</span>Français</button>
        </div>
      </section>
      <section class="set-section hidden" id="set-display-sec">
        <h3 data-i18n="display"></h3>
        <p data-i18n="displayHint"></p>
        <div class="set-options small" id="set-display">
          <button class="set-opt" data-fs="0" data-i18n="windowed"></button>
          <button class="set-opt" data-fs="1" data-i18n="fullscreen"></button>
        </div>
      </section>
      <section class="set-section">
        <h3 data-i18n="emulators"></h3>
        <p data-i18n="emulatorsHint"></p>
        <div class="emu-table">
          <div class="emu-row emu-headrow">
            <span></span><span data-i18n="emulator"></span><span data-i18n="consoles"></span>
            <span data-i18n="version"></span><span data-i18n="size"></span><span data-i18n="installed"></span>
          </div>
          <div id="emu-list"></div>
        </div>
      </section>
    </div>
    <div class="osk-hints">
      <span><b class="pad a">A</b><span data-i18n="choose"></span></span><span><b class="pad b">B</b><span data-i18n="close"></span></span>
    </div>
  </div>
</div>

<div id="confirm" class="hidden">
  <div class="confirm-panel">
    <div class="confirm-icon">⚠</div>
    <p id="confirm-text"></p>
    <div class="confirm-actions">
      <button id="confirm-yes" class="btn danger"><b class="pad a">A</b><span data-i18n="yes"></span></button>
      <button id="confirm-no" class="btn ghost"><b class="pad b">B</b><span data-i18n="no"></span></button>
    </div>
  </div>
</div>
<div id="toast" class="hidden"></div>
<script src="app.js"></script>
</body>
</html>
